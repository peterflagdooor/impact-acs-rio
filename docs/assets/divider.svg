<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A2540" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0B6FB8"/>
      <stop offset="50%" stop-color="#F8C246"/>
      <stop offset="80%" stop-color="#F26B3A"/>
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#d)" rx="1"/>
  <circle cx="0" cy="12" r="5" fill="#F26B3A">
    <animate attributeName="cx" from="0" to="1200" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
